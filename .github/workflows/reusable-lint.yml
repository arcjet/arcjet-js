name: Reusable lint workflow

on:
  workflow_call: {}

env:
  DO_NOT_TRACK: "1"

jobs:
  lint:
    name: Lint & format
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Pin npm
        uses: ./.github/actions/pin-npm
      - run: npm ci
      # Reads lockfiles only, so it runs before the build and needs no example
      # installs. Catches a vendor SDK that resolves to two versions across the
      # repo, which typechecks as two distinct declarations of the same type.
      - name: Check vendor SDK version alignment
        run: node .github/scripts/check-sdk-version-alignment.mjs
      # Type-aware lint and type checking both need each package's
      # dependencies built (for their .d.ts).
      - name: Build
        run: npm run build
      - name: Lint (oxlint)
        run: npm run lint
      - name: Format check (oxfmt)
        run: npm run format:check
      - name: Type check (tsgo)
        run: npm run typecheck

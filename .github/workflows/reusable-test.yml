name: Reusable test workflow

on:
  workflow_call: {}

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  bun-test:
    name: "Bun (OS: ${{ matrix.os }})"
    # Tests normally finish in a few minutes; cap well above that so a hung
    # process fails fast instead of running to the 6h GitHub default.
    timeout-minutes: 15
    defaults:
      run:
        # Explicit so `pipefail` is on, matching the other jobs here.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # No windows-latest: Bun cannot migrate `package-lock.json`, so
        # `bun install` resolves every package from the registry, and Windows
        # harden-runner's DNS proxy drops those lookups (`no upstream DNS
        # servers available` for registry.npmjs.org, then `ConnectionRefused`
        # on each tarball). Re-add it once that proxy is reliable on Windows.
        include:
          - os: ubuntu-latest
            bun-asset: bun-linux-x64.zip
          - os: macos-latest
            bun-asset: bun-darwin-aarch64.zip
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # The OS entries below are background traffic from the Windows and
          # macOS runner images — push and notification services, connectivity
          # probes, certificate revocation checks and time sync — not anything
          # this repository requests. They are allowed so the egress policy
          # reports a real anomaly rather than the runner talking to its vendor.
          # The same list is used by every job that runs a non-Linux runner, so
          # the three lists cannot drift apart.
          allowed-endpoints: >
            0.pool.ntp.org:123
            api.apple-cloudkit.com:443
            api.github.com:443
            api.smoot.apple.com:443
            apps.mzstatic.com:443
            bag.itunes.apple.com:443
            cds.apple.com:443
            cf.iadsdk.apple.com:443
            client.wns.windows.com:443
            configuration.apple.com:443
            cp10.cloudflare.com:443
            crl.sectigo.com:443
            crl.sectigo.com:80
            decide.arcjet.com:443
            device-config.pcms.apple.com:443
            experiments.apple.com:443
            fe2cr.update.microsoft.com:443
            fpinit.itunes.apple.com:443
            gateway.icloud.com:443
            gdmf-ados.apple.com:443
            github.com:443
            go.microsoft.com:443
            gsp-ssl.ls.apple.com:443
            gspe1-ssl.ls.apple.com:443
            gspe35-ssl.ls.apple.com:443
            help.apple.com:443
            iadsdk.apple.com:443
            incoming.telemetry.mozilla.org:443
            init.itunes.apple.com:443
            int1.stepsecurity.io:443
            ipcdn.apple.com:443
            ipv6.msftconnecttest.com:443
            ipv6.msftconnecttest.com:80
            ipv6.msftncsi.com:443
            ipv6.msftncsi.com:80
            itunes.apple.com:443
            mask-api.icloud.com:443
            mobile.events.data.microsoft.com:443
            objects.githubusercontent.com:443
            ocsp.digicert.com:443
            ocsp.digicert.com:80
            ocsp.sectigo.com:443
            ocsp.sectigo.com:80
            ocsp.usertrust.com:443
            ocsp.usertrust.com:80
            ohttp-relay1.fastly-edge.com:443
            pancake.apple.com:443
            prod.ingestion-edge.prod.dataservices.mozgcp.net:443
            proxy.safebrowsing.apple:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            safebrowsing.googleapis.com:443
            sas.pcms.apple.com:443
            settings-win.data.microsoft.com:443
            stocks-data-service.apple.com:443
            swallow.apple.com:443
            tas02.sls.update.microsoft.com:443
            token.safebrowsing.apple:443
            updates.cdn-apple.com:443
            www.msftconnecttest.com:443
            www.msftconnecttest.com:80
            www.msftncsi.com:443
            www.msftncsi.com:80
            xp.apple.com:443
            xp.g.aaplimg.com:443
          # sudo/container lockdown is Linux-only; a no-op or error on other OS.
          disable-sudo-and-containers: ${{ runner.os == 'Linux' }}
          egress-policy: block
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.2.19
          # Skip the tags API lookup; download the zip from GitHub releases.
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.2.19/${{ matrix.bun-asset }}
      - run: bun install && bun run build
      - run: bun test
        working-directory: arcjet-bun
  # Branch protection requires the check name `Run tests / Bun` (the
  # reusable workflow job name `Bun`, called from the `Run tests` job).
  bun:
    name: Bun
    if: always()
    needs: bun-test
    timeout-minutes: 2
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # This job only reads a needs result, so it needs no endpoint of its
          # own. The list is still required: `block` with none at all also drops
          # harden-runner's own API and the runner's orchestrator calls, which it
          # then reports as unexpected network calls.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - name: All Bun OS jobs passed
        run: test "${{ needs.bun-test.result }}" = "success"
  deno-test:
    name: "Deno (OS: ${{ matrix.os }})"
    timeout-minutes: 15
    defaults:
      run:
        # Git Bash on Windows so `&&` and the pin-npm composite match Linux/macOS.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # The OS entries below are background traffic from the Windows and
          # macOS runner images — push and notification services, connectivity
          # probes, certificate revocation checks and time sync — not anything
          # this repository requests. They are allowed so the egress policy
          # reports a real anomaly rather than the runner talking to its vendor.
          # The same list is used by every job that runs a non-Linux runner, so
          # the three lists cannot drift apart.
          allowed-endpoints: >
            0.pool.ntp.org:123
            api.apple-cloudkit.com:443
            api.github.com:443
            api.smoot.apple.com:443
            apps.mzstatic.com:443
            bag.itunes.apple.com:443
            cds.apple.com:443
            cf.iadsdk.apple.com:443
            client.wns.windows.com:443
            configuration.apple.com:443
            cp10.cloudflare.com:443
            crl.sectigo.com:443
            crl.sectigo.com:80
            decide.arcjet.com:443
            deno.com:443
            device-config.pcms.apple.com:443
            dl.deno.land:443
            experiments.apple.com:443
            fe2cr.update.microsoft.com:443
            fpinit.itunes.apple.com:443
            gateway.icloud.com:443
            gdmf-ados.apple.com:443
            github.com:443
            go.microsoft.com:443
            gsp-ssl.ls.apple.com:443
            gspe1-ssl.ls.apple.com:443
            gspe35-ssl.ls.apple.com:443
            help.apple.com:443
            iadsdk.apple.com:443
            incoming.telemetry.mozilla.org:443
            init.itunes.apple.com:443
            int1.stepsecurity.io:443
            ipcdn.apple.com:443
            ipv6.msftconnecttest.com:443
            ipv6.msftconnecttest.com:80
            ipv6.msftncsi.com:443
            ipv6.msftncsi.com:80
            itunes.apple.com:443
            mask-api.icloud.com:443
            mobile.events.data.microsoft.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            ocsp.digicert.com:443
            ocsp.digicert.com:80
            ocsp.sectigo.com:443
            ocsp.sectigo.com:80
            ocsp.usertrust.com:443
            ocsp.usertrust.com:80
            ohttp-relay1.fastly-edge.com:443
            pancake.apple.com:443
            prod.ingestion-edge.prod.dataservices.mozgcp.net:443
            proxy.safebrowsing.apple:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            safebrowsing.googleapis.com:443
            sas.pcms.apple.com:443
            settings-win.data.microsoft.com:443
            stocks-data-service.apple.com:443
            swallow.apple.com:443
            tas02.sls.update.microsoft.com:443
            token.safebrowsing.apple:443
            updates.cdn-apple.com:443
            www.msftconnecttest.com:443
            www.msftconnecttest.com:80
            www.msftncsi.com:443
            www.msftncsi.com:80
            xp.apple.com:443
            xp.g.aaplimg.com:443
          # sudo/container lockdown is Linux-only; a no-op or error on other OS.
          disable-sudo-and-containers: ${{ runner.os == 'Linux' }}
          egress-policy: block
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Wait for Windows DNS proxy
        if: runner.os == 'Windows'
        run: sleep 5
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
      - name: Pin npm
        uses: ./.github/actions/pin-npm
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.4.2
      - run: npm ci && npm run build
      # Quote the glob so Deno expands it on every OS (Windows Git Bash
      # would otherwise treat `**` as a single path segment).
      - run: deno test "test/**/*.test.ts" --allow-env --allow-net --allow-read=. --no-check
        working-directory: arcjet-deno
  # Branch protection requires the check name `Run tests / Deno`.
  deno:
    name: Deno
    if: always()
    needs: deno-test
    timeout-minutes: 2
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # Same as the Bun gate above: a non-empty list is what lets
          # harden-runner keep its own API and the runner's own calls allowed.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - name: All Deno OS jobs passed
        run: test "${{ needs.deno-test.result }}" = "success"
  node-test:
    name: "Run tests (OS: ${{matrix.os}}, Node: ${{ matrix.node }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # Git Bash on Windows so `&&` and the pin-npm composite match Linux/macOS.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      # Environment security
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # sudo/container lockdown is Linux-only; a no-op or error on other OS.
          disable-sudo-and-containers: ${{ runner.os == 'Linux' }}
          egress-policy: block
          # The OS entries below are background traffic from the Windows and
          # macOS runner images — push and notification services, connectivity
          # probes, certificate revocation checks and time sync — not anything
          # this repository requests. They are allowed so the egress policy
          # reports a real anomaly rather than the runner talking to its vendor.
          # The same list is used by every job that runs a non-Linux runner, so
          # the three lists cannot drift apart.
          allowed-endpoints: >
            0.pool.ntp.org:123
            api.apple-cloudkit.com:443
            api.github.com:443
            api.smoot.apple.com:443
            apps.mzstatic.com:443
            bag.itunes.apple.com:443
            cds.apple.com:443
            cf.iadsdk.apple.com:443
            client.wns.windows.com:443
            configuration.apple.com:443
            cp10.cloudflare.com:443
            crl.sectigo.com:443
            crl.sectigo.com:80
            decide.arcjet.com:443
            device-config.pcms.apple.com:443
            experiments.apple.com:443
            fe2cr.update.microsoft.com:443
            fpinit.itunes.apple.com:443
            gateway.icloud.com:443
            gdmf-ados.apple.com:443
            github.com:443
            go.microsoft.com:443
            gsp-ssl.ls.apple.com:443
            gspe1-ssl.ls.apple.com:443
            gspe35-ssl.ls.apple.com:443
            help.apple.com:443
            iadsdk.apple.com:443
            incoming.telemetry.mozilla.org:443
            init.itunes.apple.com:443
            int1.stepsecurity.io:443
            ipcdn.apple.com:443
            ipv6.msftconnecttest.com:443
            ipv6.msftconnecttest.com:80
            ipv6.msftncsi.com:443
            ipv6.msftncsi.com:80
            itunes.apple.com:443
            mask-api.icloud.com:443
            mobile.events.data.microsoft.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            ocsp.digicert.com:443
            ocsp.digicert.com:80
            ocsp.sectigo.com:443
            ocsp.sectigo.com:80
            ocsp.usertrust.com:443
            ocsp.usertrust.com:80
            ohttp-relay1.fastly-edge.com:443
            pancake.apple.com:443
            prod.ingestion-edge.prod.dataservices.mozgcp.net:443
            proxy.safebrowsing.apple:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            safebrowsing.googleapis.com:443
            sas.pcms.apple.com:443
            settings-win.data.microsoft.com:443
            stocks-data-service.apple.com:443
            swallow.apple.com:443
            tas02.sls.update.microsoft.com:443
            token.safebrowsing.apple:443
            updates.cdn-apple.com:443
            www.msftconnecttest.com:443
            www.msftconnecttest.com:80
            www.msftncsi.com:443
            www.msftncsi.com:80
            xp.apple.com:443
            xp.g.aaplimg.com:443

      # Checkout
      # Most toolchains require checkout first
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Wait for Windows DNS proxy
        if: runner.os == 'Windows'
        run: sleep 5

      # Language toolchains
      - name: Install Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}

      - name: Pin npm
        uses: ./.github/actions/pin-npm

      # Workflow

      - name: Install dependencies
        run: npm ci && npm run build

      - name: Run tests
        run: npm test

  transport-runtime:
    name: "@arcjet/transport proxy (${{ matrix.runtime }} ${{ matrix.bun-version || matrix.deno-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bun's native-fetch proxy support is exercised here (not under Node).
          # `HTTPS_PROXY` is set at process startup (by the npm script), which
          # Bun honors back to 1.3.0, the project's minimum supported Bun.
          - runtime: bun
            script: test-runtime-bun
            bun-version: 1.3.0
          - runtime: bun
            script: test-runtime-bun
            bun-version: latest
          - runtime: deno
            script: test-runtime-deno
            deno-version: lts
          - runtime: deno
            script: test-runtime-deno
            deno-version: latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          allowed-endpoints: >
            api.github.com:443
            deno.com:443
            dl.deno.land:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
      - name: Pin npm
        uses: ./.github/actions/pin-npm
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        if: matrix.runtime == 'bun'
        with:
          bun-version: ${{ matrix.bun-version }}
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        if: matrix.runtime == 'deno'
        with:
          deno-version: ${{ matrix.deno-version }}
      # Build the whole workspace first so `@arcjet/transport`'s dependencies
      # (`@arcjet/env`, `@arcjet/logger`) are available to the runtime test.
      - run: npm ci && npm run build
      - run: npm run ${{ matrix.script }} --workspace=@arcjet/transport

  arcjet-runtime:
    name: arcjet protect() (Cloudflare Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # The runtime test calls a local mock DecideService server, so the
          # Arcjet decide endpoint is never hit. `workers.cloudflare.com` is
          # contacted by miniflare's bundled workerd on startup (not by the
          # test) and must be allowed so harden-runner doesn't block it.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            workers.cloudflare.com:443
          disable-sudo-and-containers: true
          egress-policy: block
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - name: Pin npm
        uses: ./.github/actions/pin-npm
      # Build the whole workspace first so the SDK's dependencies (including the
      # `workerd` entries of `@arcjet/transport` and `@arcjet/analyze-wasm`) are
      # available to the runtime test.
      - run: npm ci && npm run build
      - run: npm run test-runtime-cloudflare --workspace=arcjet
